# Vhost de production — larrapeui.doganddev.eu
#
# À poser dans /etc/apache2/sites-available/ sur le serveur (138.201.52.27),
# puis `a2ensite larrapeui.doganddev.eu && systemctl reload apache2`.
#
# Pourquoi ce fichier existe
# --------------------------
# Le domaine n'a aujourd'hui aucun vhost 443. Une requête HTTPS retombe donc sur
# le vhost par défaut du serveur — celui de l'admin Vetzy — qui présente le
# certificat `CN=vetzy.eu` (échec TLS, aucun SAN pour ce domaine), redirige vers
# https://vetzy.eu/ et pose un cookie `vetzy_admin_session` sur le domaine
# LarappeUI. Le vhost 80 sert de son côté une page statique DOG&DEV, pas
# l'application.
#
# Ordre des opérations
# --------------------
#   1. Déployer l'application (le Dockerfile multi-stage et son HEALTHCHECK sur
#      /up sont utilisables tels quels).
#   2. Poser ce fichier, activer d'abord le bloc :80 seul.
#   3. Émettre le certificat :
#        certbot --apache -d larrapeui.doganddev.eu
#      ou l'ajouter au certificat existant :
#        certbot --expand -d vetzy.eu,...,larrapeui.doganddev.eu
#   4. Activer le bloc :443 et recharger.
#   5. Vérifier : `curl -I https://larrapeui.doganddev.eu/up` doit répondre 200
#      sans erreur TLS, et /components afficher les 88 composants.

<VirtualHost *:80>
    ServerName larrapeui.doganddev.eu
    ServerAdmin webmaster@doganddev.eu

    # Avant l'émission du certificat, commenter la redirection et décommenter
    # le DocumentRoot pour permettre la validation HTTP-01 de Let's Encrypt.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    DocumentRoot /var/www/larrapeui/public

    <Directory /var/www/larrapeui/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/larrapeui-error.log
    CustomLog ${APACHE_LOG_DIR}/larrapeui-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName larrapeui.doganddev.eu
    ServerAdmin webmaster@doganddev.eu
    DocumentRoot /var/www/larrapeui/public

    SSLEngine on
    # Chemins à ajuster selon la méthode d'émission retenue.
    SSLCertificateFile      /etc/letsencrypt/live/larrapeui.doganddev.eu/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/larrapeui.doganddev.eu/privkey.pem

    <Directory /var/www/larrapeui/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Les autres en-têtes de sécurité, CSP comprise, sont émis par le middleware
    # App\Http\Middleware\SecurityHeaders : ne pas les dupliquer ici, au risque
    # d'obtenir deux valeurs contradictoires.
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/larrapeui-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/larrapeui-ssl-access.log combined
</VirtualHost>
</IfModule>
