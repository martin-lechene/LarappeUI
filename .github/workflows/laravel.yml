name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4.1'
        coverage: none
        tools: composer:v2
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install PHP dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Install Node dependencies
      run: npm ci
    - name: Themes are in sync with their sources
      run: npm run themes:check
    - name: Build assets
      run: npm run build --if-present
    - name: PHP Code Style (Pint)
      run: vendor/bin/pint --test
    - name: PHP Static Analysis (PHPStan)
      run: vendor/bin/phpstan analyse --memory-limit=1G
    - name: JavaScript Lint (ESLint)
      run: npm run lint
    - name: JavaScript Format Check (Prettier)
      run: npm run format:check
    - name: JavaScript tests (Vitest)
      run: npm test
    - name: Directory Permissions
      run: chmod -R 775 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
    # Les tests E2E servent l'application pour de vrai : la session étant
    # stockée en base (SESSION_DRIVER=database), la table `sessions` doit
    # exister, sinon chaque page répond 500 et le serveur ne devient jamais sain.
    - name: Run migrations for the end-to-end server
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force
    - name: End-to-end tests (accessibility, themes, responsive)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: npm run test:e2e
    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  security-audit:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4.1'
        coverage: none
        tools: composer:v2
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install PHP dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Composer security advisories
      run: composer audit
    - name: npm security advisories
      run: npm audit --audit-level=high
